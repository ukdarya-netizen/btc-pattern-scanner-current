openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Alt Pattern Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scanner
    description: Multi-alt pattern scanner data
  - name: admin
    description: Admin/manual controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scanner/metrics:
    get:
      operationId: getScannerMetrics
      tags: [scanner]
      summary: Latest computed metrics for all watched symbols
      responses:
        "200":
          description: Latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinMetrics"

  /scanner/hits:
    get:
      operationId: getScannerHits
      tags: [scanner]
      summary: Recent fired pattern hits (in-memory, current session)
      responses:
        "200":
          description: Recent pattern hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatternHit"

  /scanner/signals:
    get:
      operationId: getScannerSignals
      tags: [scanner]
      summary: Recent persisted pattern signals from DB
      responses:
        "200":
          description: Recent pattern signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatternSignal"

  /scanner/open-positions:
    get:
      operationId: getScannerOpenPositions
      tags: [scanner]
      summary: Currently open (unclosed) pattern signals with live unrealized PnL
      responses:
        "200":
          description: Open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenPosition"

  /scanner/stats/overall:
    get:
      operationId: getScannerOverallStats
      tags: [scanner]
      summary: Overall signal statistics
      responses:
        "200":
          description: Overall stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverallStats"

  /scanner/stats/patterns:
    get:
      operationId: getScannerPatternStats
      tags: [scanner]
      summary: Per-pattern signal statistics
      responses:
        "200":
          description: Per-pattern stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatternStats"

  /admin/notify:
    post:
      operationId: adminNotify
      tags: [admin]
      summary: Send a manual message to the Telegram channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNotifyRequest"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AdminNotifyRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string

    PriceChange:
      type: object
      required: [current, h1, h3, h4, h24]
      properties:
        current:
          type: number
        h1:
          type: number
        h3:
          type: number
        h4:
          type: number
        h24:
          type: number

    OiChange:
      type: object
      required: [m30, h1, h4]
      properties:
        m30:
          type: number
        h1:
          type: number
        h4:
          type: number

    SpotCvd:
      type: object
      required: [m5, m15, h1, h4]
      properties:
        m5:
          type: boolean
        m15:
          type: boolean
        h1:
          type: boolean
        h4:
          type: boolean

    CoinMetrics:
      type: object
      required:
        - symbol
        - price
        - priceChange
        - oiChange
        - volMult
        - volMult4h
        - spotVolMult
        - takerNetBuyPct
        - takerNetBuyPct15m
        - takerDominance
        - spotCvd
        - fundingRate
      properties:
        symbol:
          type: string
        price:
          type: number
        priceChange:
          $ref: "#/components/schemas/PriceChange"
        oiChange:
          $ref: "#/components/schemas/OiChange"
        volMult:
          type: number
        volMult4h:
          type: number
        spotVolMult:
          type: number
        takerNetBuyPct:
          type: number
        takerNetBuyPct15m:
          type: number
        takerDominance:
          type: string
          enum: [buy, sell]
        spotCvd:
          $ref: "#/components/schemas/SpotCvd"
        fundingRate:
          type: number

    PatternHit:
      type: object
      required: [pattern, symbol, direction, reason, metrics, cycleCount]
      properties:
        pattern:
          type: string
        symbol:
          type: string
        direction:
          type: string
          enum: [LONG]
        reason:
          type: string
        metrics:
          $ref: "#/components/schemas/CoinMetrics"
        cycleCount:
          type: integer

    PatternSignal:
      type: object
      required: [id, symbol, pattern, direction, price, cycleCount, firedAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        pattern:
          type: string
        direction:
          type: string
        price:
          type: string
        cycleCount:
          type: integer
        firedAt:
          type: string
        closedAt:
          type: string
          nullable: true
        closePrice:
          type: string
          nullable: true
        pnlPct:
          type: string
          nullable: true

    OpenPosition:
      type: object
      required: [id, symbol, pattern, entryPrice, cyclesHeld, currentPrice, unrealizedPnlPct]
      properties:
        id:
          type: integer
        symbol:
          type: string
        pattern:
          type: string
        entryPrice:
          type: number
        cyclesHeld:
          type: integer
        currentPrice:
          type: number
        unrealizedPnlPct:
          type: number

    OverallStats:
      type: object
      required: [total, open, closed, wins, losses, winRate, avgPnlPct]
      properties:
        total:
          type: integer
        open:
          type: integer
        closed:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winRate:
          type: number
        avgPnlPct:
          type: number

    PatternStats:
      type: object
      required: [pattern, total, closed, wins, winRate, avgPnlPct]
      properties:
        pattern:
          type: string
        total:
          type: integer
        closed:
          type: integer
        wins:
          type: integer
        winRate:
          type: number
        avgPnlPct:
          type: number
